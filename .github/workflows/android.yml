name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: mkdir build && unzip -q project.zip -d build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Signing key
        run: |
          mkdir -p ~/.android
          cp build/ci/debug.keystore ~/.android/debug.keystore
      - name: Install packages
        run: npm install
        working-directory: build
      - name: Create Android project
        run: |
          npx cap add android
          python3 ci/prepare.py
          npx cap sync android
        working-directory: build
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../amar-din.apk
        working-directory: build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Amar Din v${{ github.run_number }}
          files: amar-din.apk
